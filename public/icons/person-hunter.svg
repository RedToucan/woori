<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none" style="color:#e2ad3d">
  <title>수렵채집인</title>
  <desc>가죽옷을 입고 한 손으로 긴 창을 잡은 수렵채집인. 팔을 굽혀 창을 지탱하고 두 발을 벌려 서 있는 자세.</desc>
  <!-- 창은 몸 옆에 배치하고 손이 창대를 감싸도록 뒤에서 그립니다. -->
