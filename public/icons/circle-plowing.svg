<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none" style="color:#c5a466">
  <title>소가 끄는 쟁기질</title>
  <desc>왼쪽의 뿔 달린 소가 멍에와 긴 쟁기채를 끌고, 오른쪽의 농부가 두 손으로 손잡이를 잡아 쟁기날을 땅에 대는 모습.</desc>
  <circle cx="80" cy="80" r="73" fill="#151513" stroke="currentColor" stroke-opacity=".7" stroke-width="1.5"/>
  <!-- 소의 먼 쪽 다리는 가늘게 구분합니다. -->
  <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".7">
    <path d="m44 87 3 11-6 9h-3m25-20 1 10 8 9h3"/>
  </g>
  <!-- 어깨, 가슴, 주둥이와 귀가 구분되는 소의 실루엣. -->
  <path d="M30 72c4-2 5-8 10-8l6 3h18c7 0 10 5 9 12l-3 9-7 5-18-2-7-5-3-6-4 3-8 1-3-4 6-6-2-7 6 5Z" fill="currentColor"/>
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 72c-5-3-7-8-5-12m8 11c3-4 4-8 2-12" stroke-width="2.2"/>
    <path d="m39 86-2 12-6 10h-4m37-19-5 10 6 10h4" stroke-width="3.3"/>
    <path d="M71 71c6 3 4 12 7 17l2 2" stroke-width="1.8"/>
    <path d="m79 88 2 5" stroke-width="3"/>
  </g>
  <circle cx="28" cy="76" r="1.2" fill="#151513"/>
  <path d="m23 81 5-1m15-11-4 13m3 2 3 3" stroke="#151513" stroke-width="1.3" stroke-linecap="round"/>
  <!-- 멍에에서 쟁기날까지 이어지는 쟁기채와 지지대. -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="m35 67 10 6-3 13" stroke-width="3"/>
    <path d="m43 79 55 24" stroke-width="3.2"/>
    <path d="m55 91 41 13" stroke-width="1.4"/>
    <path d="m98 105 7-26 7-4m-12 30 13-22 5-2" stroke-width="2.6"/>
    <path d="m99 91 8 1" stroke-width="1.7"/>
  </g>
  <path d="m98 101 6 5-5 7-15 2 8-6 6-8Z" fill="currentColor"/>
  <path d="m92 112 7-5" stroke="#151513" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 몸을 앞으로 기울인 농부가 두 손으로 손잡이를 잡습니다. -->
  <circle cx="122" cy="56" r="5.2" fill="currentColor"/>
  <path d="M115 65c3-3 7-2 9 0l3 16-6 7-8-4 3-19Z" fill="currentColor"/>
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="m116 69-3 7-7 3m16-10-2 10-7 4" stroke-width="3.3"/>
    <path d="m118 86-3 13-6 14h-4m19-28 3 13 3 14h4" stroke-width="4"/>
    <path d="M115 54h14" stroke-width="1.7"/>
    <path d="m31 121 9-5m8 9 11-7m8 10 11-8m12 8 12-8m9 4 10-5" stroke-width="1.6" opacity=".65"/>
  </g>
</svg>
